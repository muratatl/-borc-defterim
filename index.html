<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827"><meta name="description" content="Kişisel borç takip uygulaması">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml">	itle>Borç Defterim</title>
<style>
:root{--bg:#0b1220;--panel:#141f30;--panel2:#1b293d;--line:#28364b;--text:#f1f5f9;--muted:#95a5ba;--blue:#5ea4ff;--green:#3dd6a0;--red:#ff737d;--amber:#f6be58;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:0 0 calc(30px + env(safe-area-inset-bottom));}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;color:inherit}header{padding:24px 18px 10px;display:flex;align-items:center;justify-content:space-between;max-width:780px;margin:auto}.brand{font-size:19px;font-weight:800;letter-spacing:-.4px}.brand span{color:var(--blue)}.subtitle{font-size:12px;color:var(--muted);margin-top:3px}.wrap{max-width:780px;margin:auto;padding:8px 16px}.hero{background:linear-gradient(135deg,#17273e,#1d3451);border:1px solid #2c4663;border-radius:22px;padding:20px;margin-bottom:14px}.label{color:#a7bdd7;font-size:12px}.total{font-size:34px;font-weight:800;letter-spacing:-1px;margin:6px 0 18px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#0f1b2b99;border:1px solid #334960;border-radius:14px;padding:12px}.stat .slabel{font-size:11px;color:#a8bbd0}.stat .svalue{font-size:19px;font-weight:700;margin-top:4px}.progressline{height:7px;border-radius:99px;background:#31445c;overflow:hidden;margin-top:12px}.progressline div{height:100%;background:var(--green);width:0%;transition:width .2s}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.primary,.secondary{padding:14px;border-radius:14px;font-weight:700}.primary{background:var(--blue);color:#071423}.secondary{background:var(--panel2);border:1px solid var(--line)}.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0 12px}.tab{white-space:nowrap;background:transparent;color:var(--muted);padding:10px 13px;border-radius:12px}.tab.active{background:var(--panel2);color:var(--text);font-weight:700}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 10px}.sectionhead h2{font-size:17px;margin:0}.sectionhead small{color:var(--muted)}.filters{display:flex;gap:8px;margin-bottom:10px}.filters input,.filters select{min-width:0;flex:1;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:11px;border-radius:12px}.debtlist{display:grid;gap:10px}.debt{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:14px}.debt-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.debt-name{font-weight:700;font-size:16px}.chip{font-size:11px;padding:5px 8px;border-radius:99px;background:#26364b;color:#b9cbe0}.chip.closed{background:#163d33;color:#83e2bd}.chip.overdue{background:#472a31;color:#ffadb2}.debt-remaining{font-size:23px;font-weight:800;margin:10px 0 2px}.meta{font-size:12px;color:var(--muted)}.debt-progress{height:5px;background:#27364b;border-radius:9px;overflow:hidden;margin:10px 0}.debt-progress div{height:100%;background:var(--green)}.debt-actions{display:flex;gap:8px;margin-top:10px}.smallbtn{background:var(--panel2);border:1px solid var(--line);padding:9px 11px;border-radius:10px;font-size:12px}.smallbtn.pay{background:#173b34;color:#8ae3bd;border-color:#27594b}.empty{padding:32px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:12px}.sheet{width:min(100%,560px);max-height:92dvh;overflow:auto;background:#111c2b;border:1px solid var(--line);border-radius:22px;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 20px 70px #0007}.sheet h2{margin:0 0 16px;font-size:20px}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;background:#0b1422;color:var(--text);border:1px solid #2b3a50;border-radius:12px;padding:12px;outline:none}.field textarea{min-height:72px;resize:vertical}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sheetbuttons{display:flex;gap:9px;margin-top:18px}.sheetbuttons button{flex:1}.notice{color:var(--muted);font-size:12px;line-height:1.5;margin-top:10px}.history-item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.history-item:last-child{border:0}.positive{color:var(--green)}.negative{color:var(--red)}.footer{color:#6d7e93;text-align:center;font-size:11px;padding:24px 8px}.menu{display:flex;gap:7px}.iconbtn{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#223449;padding:12px 16px;border:1px solid #40566e;border-radius:14px;z-index:40;box-shadow:0 6px 30px #0007;white-space:nowrap}.settings{display:grid;gap:10px}.settings button{width:100%;text-align:left}.monthbox{background:var(--panel);border:1px solid var(--line);padding:14px;border-radius:16px;margin-bottom:12px}.monthbox h3{margin:0 0 10px;font-size:14px}.monthrow{display:flex;justify-content:space-between;padding:7px 0;color:var(--muted)}@media(min-width:650px){.modal{align-items:center}.hero{padding:24px}.wrap{padding:8px 22px}}
</style>
</head>
<body>
<header><div><div class="brand">Borç <span>Defterim</span></div><div class="subtitle">Kişisel borç takip alanın</div></div><div class="menu"><button class="iconbtn" id="settingsBtn" aria-label="Ayarlar">⚙</button></div></header>
<main class="wrap">
<section class="hero"><div class="label">TOPLAM KALAN BORÇ</div><div class="total" id="totalDebt">₺0</div><div class="stats"><div class="stat"><div class="slabel">Bu ay ödenen</div><div class="svalue" id="monthPaid">₺0</div></div><div class="stat"><div class="slabel">Aktif borç</div><div class="svalue" id="activeCount">0</div></div></div><div class="progressline"><div id="overallProgress"></div></div><div class="label" id="overallLabel" style="margin-top:7px">Henüz borç kaydı yok</div></section>
<div class="actions"><button class="primary" id="addDebtBtn">＋ Borç ekle</button><button class="secondary" id="addPaymentBtn">₺ Ödeme kaydet</button></div>
<div class="tabs"><button class="tab active" data-view="debts">Borçlarım</button><button class="tab" data-view="history">Ödeme geçmişi</button><button class="tab" data-view="summary">Aylık özet</button></div>
<div id="debtsView"><div class="filters"><input id="search" placeholder="Borç ara…"><select id="statusFilter"><option value="all">Tüm borçlar</option><option value="active">Aktif</option><option value="closed">Kapalı</option></select></div><div class="sectionhead"><h2>Kaydedilen borçlar</h2><small id="debtCount">0 kayıt</small></div><div class="debtlist" id="debtList"></div></div>
<div id="historyView" class="hidden"><div class="sectionhead"><h2>Ödeme geçmişi</h2><small id="paymentCount">0 işlem</small></div><div id="historyList"></div></div>
<div id="summaryView" class="hidden"><div class="sectionhead"><h2>Aylık özet</h2></div><div id="monthlySummary"></div></div>
<div class="footer">Veriler bu tarayıcıda saklanır. Düzenli yedek almayı unutma.</div></main>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<script>
const KEY='borcDefterim_v1';let db={debts:[],payments:[]};let activeView='debts';let editId=null;
const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(Number(n||0));
const dateTR=s=>s?new Date(s+'T12:00:00').toLocaleDateString('tr-TR'):'—';const today=()=>new Date().toISOString().slice(0,10);const monthKey=d=>d.slice(0,7);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function load(){try{const raw=localStorage.getItem(KEY);if(raw)db=JSON.parse(raw)}catch(e){toast('Kayıtlar okunamadı.')}render()}
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function remaining(d){return Math.max(0,Number(d.amount||0)-db.payments.filter(p=>p.debtId===d.id).reduce((s,p)=>s+Number(p.amount||0),0))}
function paid(d){return Number(d.amount||0)-remaining(d)}
function monthPayments(){return db.payments.filter(p=>monthKey(p.date||today())===monthKey(today())).reduce((s,p)=>s+Number(p.amount||0),0)}
function render(){const total=db.debts.reduce((s,d)=>s+remaining(d),0),orig=db.debts.reduce((s,d)=>s+Number(d.amount||0),0),paidAll=orig-total,active=db.debts.filter(d=>remaining(d)>0).length;document.getElementById('totalDebt').textContent=money(total);document.getElementById('monthPaid').textContent=money(monthPayments());document.getElementById('activeCount').textContent=active;let pct=orig?Math.min(100,paidAll/orig*100):0;document.getElementById('overallProgress').style.width=pct+'%';document.getElementById('overallLabel').textContent=orig?`${pct.toFixed(1)}% borç kapatıldı · ${money(paidAll)} ödendi`:'Henüz borç kaydı yok';
renderDebts();renderHistory();renderSummary();showView(activeView)}
function renderDebts(){const q=(document.getElementById('search').value||'').toLocaleLowerCase('tr'),f=document.getElementById('statusFilter').value;let list=db.debts.filter(d=>(d.name+' '+d.category+' '+d.person+' '+d.note).toLocaleLowerCase('tr').includes(q)).filter(d=>f==='all'||(f==='active'?remaining(d)>0:remaining(d)===0)).sort((a,b)=> (a.due||'9999').localeCompare(b.due||'9999'));document.getElementById('debtCount').textContent=list.length+' kayıt';const el=document.getElementById('debtList');if(!list.length){el.innerHTML='<div class="empty">Henüz borç yok.<br>İlk borcunu ekleyerek başlayabilirsin.</div>';return}el.innerHTML=list.map(d=>{const rem=remaining(d),pr=d.amount?paid(d)/d.amount*100:0,closed=rem===0,over=!closed&&d.due&&d.due<today();return `<article class="debt"><div class="debt-top"><div><div class="debt-name">${esc(d.name)}</div><div class="meta">${esc(d.category||'Diğer')} ${d.person?'· '+esc(d.person):''}</div></div><span class="chip ${closed?'closed':over?'overdue':''}">${closed?'Kapandı':over?'Gecikmiş':'Aktif'}</span></div><div class="debt-remaining">${money(rem)}</div><div class="meta">Kalan · İlk tutar ${money(d.amount)} · Ödenen ${money(paid(d))}</div>${d.due?`<div class="meta" style="margin-top:5px">Son ödeme: ${dateTR(d.due)}</div>`:''}<div class="debt-progress"><div style="width:${Math.min(100,pr)}%"></div></div><div class="debt-actions">${!closed?`<button class="smallbtn pay" onclick="paymentForm('${d.id}')">＋ Ödeme</button>`:''}<button class="smallbtn" onclick="debtForm('${d.id}')">Düzenle</button><button class="smallbtn" onclick="debtDetail('${d.id}')">Detay</button></div></article>`}).join('')}
function renderHistory(){let arr=[...db.payments].sort((a,b)=>(b.date||'').localeCompare(a.date||''));document.getElementById('paymentCount').textContent=arr.length+' işlem';let el=document.getElementById('historyList');if(!arr.length){el.innerHTML='<div class="empty">Henüz ödeme kaydı yok.</div>';return}el.innerHTML=arr.map(p=>{let d=db.debts.find(d=>d.id===p.debtId);return `<div class="history-item"><div><b>${esc(d?.name||'Silinmiş borç')}</b><div class="meta">${dateTR(p.date)}${p.note?' · '+esc(p.note):''}</div></div><div style="text-align:right"><b class="positive">− ${money(p.amount)}</b><div><button class="smallbtn" style="margin-top:5px" onclick="deletePayment('${p.id}')">Sil</button></div></div></div>`}).join('')}
function renderSummary(){let sums={};db.payments.forEach(p=>{let m=(p.date||today()).slice(0,7);sums[m]=(sums[m]||0)+Number(p.amount||0)});let keys=Object.keys(sums).sort().reverse();let el=document.getElementById('monthlySummary');if(!keys.length){el.innerHTML='<div class="empty">Ödeme yaptıkça aylık özetin burada oluşacak.</div>';return}el.innerHTML=keys.map(m=>`<div class="monthbox"><h3>${new Date(m+'-15').toLocaleDateString('tr-TR',{month:'long',year:'numeric'})}</h3><div class="monthrow"><span>Toplam ödeme</span><b class="positive">${money(sums[m])}</b></div><div class="monthrow"><span>İşlem sayısı</span><b>${db.payments.filter(p=>(p.date||today()).slice(0,7)===m).length}</b></div></div>`).join('')}
function showView(v){activeView=v;['debts','history','summary'].forEach(x=>document.getElementById(x+'View').classList.toggle('hidden',x!==v));document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===v))}
function openModal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}
function debtForm(id=''){let d=db.debts.find(x=>x.id===id)||{name:'',category:'Diğer',amount:'',date:today(),due:'',person:'',note:''};editId=id||null;openModal(`<h2>${id?'Borcu düzenle':'Yeni borç ekle'}</h2><form id="debtForm"><div class="field"><label>Borç adı *</label><input name="name" required maxlength="70" value="${esc(d.name)}" placeholder="Örn. Kredi kartı, Ali'ye borç"></div><div class="row2"><div class="field"><label>Kategori</label><select name="category">${['Kredi kartı','Kredi','Kişisel borç','Ev / araç','Diğer'].map(c=>`<option ${d.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Başlangıç tutarı (₺) *</label><input name="amount" type="number" step="0.01" min="0.01" required value="${d.amount}"></div></div><div class="row2"><div class="field"><label>Başlangıç tarihi</label><input name="date" type="date" value="${d.date||today()}"></div><div class="field"><label>Son ödeme tarihi</label><input name="due" type="date" value="${d.due||''}"></div></div><div class="field"><label>Kişi / kurum</label><input name="person" value="${esc(d.person||'')}" placeholder="İsteğe bağlı"></div><div class="field"><label>Not</label><textarea name="note" placeholder="İsteğe bağlı">${esc(d.note||'')}</textarea></div><div class="sheetbuttons"><button type="button" class="secondary" onclick="closeModal()">Vazgeç</button><button class="primary" type="submit">Kaydet</button></div></form>`);document.getElementById('debtForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),obj={id:id||crypto.randomUUID(),name:f.get('name').trim(),category:f.get('category'),amount:Number(f.get('amount')),date:f.get('date'),due:f.get('due'),person:f.get('person').trim(),note:f.get('note').trim()};if(id){let old=db.debts.findIndex(x=>x.id===id);db.debts[old]=obj}else db.debts.push(obj);closeModal();save();toast(id?'Borç güncellendi':'Borç eklendi')}}
function paymentForm(debtId=''){let d=db.debts.find(x=>x.id===debtId)||null;openModal(`<h2>Ödeme kaydet</h2><form id="payForm"><div class="field"><label>Borç seç *</label><select name="debtId" required>${db.debts.filter(x=>remaining(x)>0).map(x=>`<option value="${x.id}" ${d?.id===x.id?'selected':''}>${esc(x.name)} — ${money(remaining(x))} kalan</option>`).join('')}</select></div><div class="field"><label>Ödeme tutarı (₺) *</label><input name="amount" type="number" min="0.01" step="0.01" required placeholder="0,00"></div><div class="field"><label>Ödeme tarihi</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Açıklama</label><input name="note" maxlength="100" placeholder="İsteğe bağlı"></div><div class="sheetbuttons"><button type="button" class="secondary" onclick="closeModal()">Vazgeç</button><button type="submit" class="primary">Ödemeyi kaydet</button></div></form>`);document.getElementById('payForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),id=f.get('debtId'),amount=Number(f.get('amount')),d2=db.debts.find(x=>x.id===id);if(!d2)return;if(amount>remaining(d2)+0.001){toast('Ödeme kalan borçtan fazla olamaz.');return}db.payments.push({id:crypto.randomUUID(),debtId:id,amount,date:f.get('date'),note:f.get('note').trim()});closeModal();save();toast('Ödeme kaydedildi')}}
function debtDetail(id){let d=db.debts.find(x=>x.id===id);if(!d)return;let pays=db.payments.filter(p=>p.debtId===id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));openModal(`<h2>${esc(d.name)}</h2><div class="monthbox"><div class="monthrow"><span>Başlangıç</span><b>${money(d.amount)}</b></div><div class="monthrow"><span>Ödenen</span><b class="positive">${money(paid(d))}</b></div><div class="monthrow"><span>Kalan</span><b>${money(remaining(d))}</b></div><div class="monthrow"><span>Kategori</span><b>${esc(d.category)}</b></div>${d.due?`<div class="monthrow"><span>Vade</span><b>${dateTR(d.due)}</b></div>`:''}${d.note?`<p class="notice">${esc(d.note)}</p>`:''}</div><h3 style="font-size:14px">Bu borcun ödemeleri</h3>${pays.length?pays.map(p=>`<div class="history-item"><span>${dateTR(p.date)}${p.note?' · '+esc(p.note):''}</span><b class="positive">−${money(p.amount)}</b></div>`).join(''):'<div class="empty">Ödeme yok.</div>'}<div class="sheetbuttons"><button class="secondary" onclick="closeModal()">Kapat</button>${remaining(d)>0?`<button class="primary" onclick="closeModal();paymentForm('${id}')">Ödeme yap</button>`:''}</div>`)}
function deletePayment(id){if(!confirm('Bu ödeme kaydını silmek istiyor musun?'))return;db.payments=db.payments.filter(p=>p.id!==id);save();toast('Ödeme silindi')}
function settings(){openModal(`<h2>Ayarlar & Yedek</h2><div class="settings"><button class="secondary" onclick="exportBackup()">⬇️ Yedek indir (JSON)</button><button class="secondary" onclick="document.getElementById('restoreInput').click()">⬆️ Yedek geri yükle</button><button class="secondary" onclick="exportCSV()">📄 Ödeme geçmişini CSV indir</button><button class="secondary" onclick="clearAll()">🗑️ Tüm kayıtları sil</button></div><input id="restoreInput" type="file" accept="application/json" class="hidden"><p class="notice">Kayıtlar yalnızca bu tarayıcıda tutulur. Tarayıcı verilerini temizlemek kayıtlarını silebilir. Düzenli yedek al.</p><div class="sheetbuttons"><button class="primary" onclick="closeModal()">Tamam</button></div>`);document.getElementById('restoreInput').onchange=restoreBackup}
function exportBackup(){let blob=new Blob([JSON.stringify({...db,backupDate:new Date().toISOString(),version:1},null,2)],{type:'application/json'});download(blob,'borc-defterim-yedek-'+today()+'.json');toast('Yedek dosyası hazır')}
function restoreBackup(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.debts)||!Array.isArray(x.payments))throw Error();if(!confirm('Yedek içindeki kayıtlar mevcut kayıtların yerine yüklensin mi?'))return;db={debts:x.debts,payments:x.payments};save();closeModal();toast('Yedek geri yüklendi')}catch(err){toast('Yedek dosyası geçersiz')}};r.readAsText(file)}
function exportCSV(){let rows=[['Borç','Kategori','Tarih','Tutar','Not'],...db.payments.map(p=>[db.debts.find(d=>d.id===p.debtId)?.name||'Silinmiş borç',db.debts.find(d=>d.id===p.debtId)?.category||'',p.date,p.amount,p.note||''])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'borc-defterim-odemeler.csv')}
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function clearAll(){if(!confirm('Tüm borç ve ödeme kayıtları kalıcı olarak silinsin mi?'))return;if(!confirm('Son kez soruyorum. Yedek almadan silmek istediğine emin misin?'))return;db={debts:[],payments:[]};save();closeModal();toast('Tüm kayıtlar silindi')}
function toast(msg){let t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
document.getElementById('addDebtBtn').onclick=()=>debtForm();document.getElementById('addPaymentBtn').onclick=()=>paymentForm();document.getElementById('settingsBtn').onclick=settings;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showView(b.dataset.view));document.getElementById('search').oninput=renderDebts;document.getElementById('statusFilter').onchange=renderDebts;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};window.debtForm=debtForm;window.paymentForm=paymentForm;window.debtDetail=debtDetail;window.deletePayment=deletePayment;window.closeModal=closeModal;window.exportBackup=exportBackup;window.exportCSV=exportCSV;window.restoreBackup=restoreBackup;window.clearAll=clearAll;load();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
